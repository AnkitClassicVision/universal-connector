[project]
name = "universal-connector-runbooks"
version = "0.1.0"
description = "Runbooks and tools to gather your connections into one portable door for your agent harnesses"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]

[tool.ruff]
line-length = 200
target-version = "py311"
extend-exclude = ["tools/lint.py", "tools/scaffold.py", "tools/graph.py", "tools/sync.py", "tools/compare.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
